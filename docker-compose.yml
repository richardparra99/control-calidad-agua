services:

  postgres-usuarios:
    image: postgres:17
    container_name: postgres-usuarios
    restart: unless-stopped

    environment:
      POSTGRES_DB: usuarios_db
      POSTGRES_USER: ${DB_USUARIO}
      POSTGRES_PASSWORD: ${DB_CONTRASENA}

    ports:
      - "127.0.0.1:15432:5432"

    volumes:
      - datos-usuarios:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO} -d usuarios_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - red-calidad-agua


  user-service:
    build:
      context: ./backend/servicio-usuario
      dockerfile: Dockerfile

    container_name: user-service
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      DB_URL: jdbc:postgresql://postgres-usuarios:5432/usuarios_db
      DB_USUARIO: ${DB_USUARIO}
      DB_CONTRASENA: ${DB_CONTRASENA}

      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    depends_on:
      postgres-usuarios:
        condition: service_healthy

    networks:
      - red-calidad-agua


volumes:
  datos-usuarios:


networks:
  red-calidad-agua:
    driver: bridge
