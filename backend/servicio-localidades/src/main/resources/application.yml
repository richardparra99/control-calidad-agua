server:
  port: 8082

spring:
  application:
    name: location-service

  datasource:
    url: ${LOCATION_DB_URL:jdbc:postgresql://127.0.0.1:15433/locations_db}
    username: ${LOCATION_DB_USER:postgres}
    password: ${LOCATION_DB_PASSWORD}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}

users:
  base-url: ${USER_SERVICE_URL:http://127.0.0.1:8081}