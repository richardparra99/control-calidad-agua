
server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/usuarios_db}
    username: ${DB_USUARIO:postgres}
    password: ${DB_CONTRASENA}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
